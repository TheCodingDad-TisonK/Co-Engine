name: Release

# Push a tag like v1.1.0 and this builds the Windows installer and attaches it to a GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          short="${want%.0}"
          if [ "$GITHUB_REF_NAME" != "$want" ] && [ "$GITHUB_REF_NAME" != "$short" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; fi
      - run: npm run installer
      - uses: actions/upload-artifact@v4
        with:
          name: Game-windows
          path: dist/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
