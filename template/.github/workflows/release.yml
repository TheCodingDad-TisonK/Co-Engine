name: Release

# Push a tag like v1.1.0 and this builds the Windows installer and attaches it to a GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Read access to the private engine repo
        shell: bash
        env:
          CO_ENGINE_TOKEN: ${{ secrets.CO_ENGINE_TOKEN }}
        run: |
          if [ -z "$CO_ENGINE_TOKEN" ]; then echo "::error::The CO_ENGINE_TOKEN secret is missing. Co Engine is a private repo, so npm cannot fetch it without a read-only token (see the repo's Settings, Secrets and variables, Actions)."; exit 1; fi
          git config --local --unset-all http.https://github.com/.extraheader || true   # the checkout token would be sent instead of ours, and it cannot see Co-Engine
          base="https://x-access-token:${CO_ENGINE_TOKEN}@github.com/TheCodingDad-TisonK/Co-Engine"
          git config --global url."$base".insteadOf "ssh://git@github.com/TheCodingDad-TisonK/Co-Engine"
          git config --global --add url."$base".insteadOf "git@github.com:TheCodingDad-TisonK/Co-Engine"
          git config --global --add url."$base".insteadOf "https://github.com/TheCodingDad-TisonK/Co-Engine"
      - run: npm ci
      - name: The tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          short="${want%.0}"
          if [ "$GITHUB_REF_NAME" != "$want" ] && [ "$GITHUB_REF_NAME" != "$short" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; fi
      - run: npm run installer
      - uses: actions/upload-artifact@v4
        with:
          name: Game-windows
          path: dist/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
