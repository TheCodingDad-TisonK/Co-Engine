<!-- App icon: a cube on a dark badge, drawn in code, rendered by node_modules/co-engine/tools/render-brand.js (npm run brand).
     ?size=256 sets the canvas; ?simple=1 drops the shading for 32px and below. Replace the mark with your game's own. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { position: relative; overflow: hidden; }
  .badge { position: absolute; inset: 0; border-radius: 22.3%; background:
      radial-gradient(120% 110% at 28% 18%, #2a3140 0%, #1a2029 42%, #0e1217 74%, #080a0d 100%); }
  .rim { position: absolute; inset: 0; border-radius: 22.3%; box-shadow: inset 0 0 0 var(--rim) rgba(120, 189, 245, .40); }
  .gloss { position: absolute; left: 0; right: 0; top: 0; height: 46%; border-radius: 22.3% 22.3% 50% 50% / 30% 30% 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,0)); }
  .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .mark svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div class="badge"></div>
  <div class="gloss"></div>
  <div class="mark" id="mark"></div>
  <div class="rim" id="rim"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var S = +q.get('size') || 256, simple = q.get('simple') === '1';
  var stage = document.getElementById('stage');
  stage.style.width = S + 'px'; stage.style.height = S + 'px';
  document.documentElement.style.setProperty('--rim', Math.max(1, Math.round(S * 0.012)) + 'px');
  var size = Math.round(S * (simple ? 0.78 : 0.70));
  var mark = document.getElementById('mark');
  mark.style.width = size + 'px'; mark.style.height = size + 'px';
  mark.style.filter = 'drop-shadow(0 ' + (S * 0.012) + 'px ' + (S * 0.02) + 'px rgba(0,0,0,.55))';
  // an isometric cube: three faces in three shades of the accent
  var cube =
    '<polygon points="50,8 90,30 50,52 10,30" fill="#9fd0ff"' + (simple ? '' : ' stroke="#3e78b0" stroke-width="1.5"') + '/>' +
    '<polygon points="10,30 50,52 50,96 10,74" fill="#4f9be0"' + (simple ? '' : ' stroke="#3e78b0" stroke-width="1.5"') + '/>' +
    '<polygon points="90,30 50,52 50,96 90,74" fill="#2f6ea8"' + (simple ? '' : ' stroke="#3e78b0" stroke-width="1.5"') + '/>';
  mark.innerHTML = '<svg viewBox="0 0 100 100">' + cube + '</svg>';
</script>
</body>
</html>
