<!-- App icon: the CO badge, drawn in code, rendered by tools/render-brand.js.
     ?size=256 sets the canvas; ?simple=1 crops to the ring and the letters for 32px and below. -->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  #stage { position: relative; overflow: hidden; }
  .badge { position: absolute; inset: 0; border-radius: 23%;
      background: radial-gradient(120% 110% at 28% 18%, #2b3440 0%, #1a222c 42%, #0e141b 74%, #080a0d 100%); }
  .rim { position: absolute; inset: 0; border-radius: 23%; box-shadow: inset 0 0 0 var(--rim) rgba(245, 181, 61, .50); }
  .gloss { position: absolute; left: 0; right: 0; top: 0; height: 46%; border-radius: 23% 23% 50% 50% / 30% 30% 100% 100%;
      background: linear-gradient(180deg, rgba(255,255,255,.085), rgba(255,255,255,0)); }
  .mark { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .mark svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="stage">
  <div class="badge"></div>
  <div class="gloss"></div>
  <div class="mark" id="mark"></div>
  <div class="rim" id="rim"></div>
</div>
<script>
  var q = new URLSearchParams(location.search);
  var S = +q.get('size') || 256, simple = q.get('simple') === '1';
  var stage = document.getElementById('stage');
  stage.style.width = S + 'px'; stage.style.height = S + 'px';
  document.documentElement.style.setProperty('--rim', Math.max(1, Math.round(S * 0.014)) + 'px');
  var size = Math.round(S * (simple ? 0.86 : 0.78));
  var mark = document.getElementById('mark');
  mark.style.width = size + 'px'; mark.style.height = size + 'px';
  mark.style.filter = 'drop-shadow(0 ' + (S * 0.012) + 'px ' + (S * 0.02) + 'px rgba(0,0,0,.55))';
  var font = "Bahnschrift, 'Segoe UI', Arial, sans-serif";
  // the gear ring: short dashes round a circle, the engine turns inside it
  var ring = '<circle cx="50" cy="52" r="26" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="8" stroke-dasharray="7.6 7.1" stroke-linecap="round"/>';
  var ringSolid = '<circle cx="50" cy="52" r="26" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="9"/>';
  var letters = '<text x="50" y="63" text-anchor="middle" font-family="' + font + '" font-size="34" font-weight="700" fill="#f5b53d">CO</text>';
  mark.innerHTML = '<svg viewBox="' + (simple ? '16 18 68 68' : '0 0 100 100') + '">' + (simple ? ringSolid : ring) + letters + '</svg>';
</script>
</body>
</html>
