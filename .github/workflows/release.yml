name: Release

# Push a tag like v0.1.7 and this builds the editor as one portable exe and attaches it to a GitHub release,
# so the latest editor is always at github.com/TheCodingDad-TisonK/Co-Engine/releases/latest.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; fi
      - run: npm run check
      - run: node tests/mcp.test.js
      - run: npm run editor:exe
      - uses: actions/upload-artifact@v4
        with:
          name: Co-Engine-windows
          path: dist/*.exe
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
