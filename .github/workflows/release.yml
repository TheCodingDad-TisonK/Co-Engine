name: Release

# Push a tag like v0.9.4 and this checks the engine and writes the GitHub release with its notes.
# The editor exe is private (all rights reserved): it is built on the author's machine with npm run editor:exe and is never attached here.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: The tag must match package.json
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "Tag $GITHUB_REF_NAME does not match package.json ($want)"; exit 1; fi
      - run: npm run check
      - run: node tests/mcp.test.js
      - name: The release, notes only
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
